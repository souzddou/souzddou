  <defs>
    <style>
      .panel { fill: #0d1117; stroke: #2a313d; stroke-width: 1.5; }
      .line-complete { stroke: #25c26e; stroke-width: 2.2; fill: none; opacity: 0.9; }
      .line-pending { stroke: #455064; stroke-width: 2.2; fill: none; opacity: 0.9; }
      .node-complete { fill: #1d3b2c; stroke: #2fce7a; stroke-width: 1.6; rx: 10; ry: 10; }
      .node-pending { fill: #1b2230; stroke: #4a566c; stroke-width: 1.4; rx: 10; ry: 10; }
      .text-complete { fill: #d8ffe9; font: 600 15px 'Inter', 'Segoe UI', Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .text-pending { fill: #d0d6e2; font: 600 15px 'Inter', 'Segoe UI', Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .cap { fill: #9cb0c8; font: 500 12px 'Inter', 'Segoe UI', Arial, sans-serif; }
      .ctrl { fill: #121826; stroke: #4a566c; stroke-width: 1.2; rx: 6; ry: 6; }
      .ctrl-icon { stroke: #9cb0c8; stroke-width: 1.6; fill: none; stroke-linecap: round; }
      .section-label { fill: #6e7681; font: 600 14px 'Inter', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>


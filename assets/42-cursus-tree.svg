<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">42 Cursus Dependency Tree</title>
  <desc id="desc">Dependency tree of the 42 cursus with completion states.</desc>
  <defs>
    <style>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 1800"
     role="img"
     aria-labelledby="title desc">

  <title id="title">42 Cursus Roadmap</title>
  <desc id="desc">Vertical dark themed 42 School cursus roadmap.</desc>

  <defs>
    <style>
      .panel {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 2;
      }

      .line-complete {
        stroke: #2fce7a;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .line-pending {
        stroke: #4a5568;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 7 7;
      }

      .node-complete {
        fill: #173524;
        stroke: #2fce7a;
        stroke-width: 2;
      }

      .node-special {
        fill: #17243a;
        stroke: #58a6ff;
        stroke-width: 2;
      }

      .node-pending {
        fill: #161b22;
        stroke: #484f58;
        stroke-width: 2;
      }

      .title {
        fill: #f0f6fc;
        font: 700 30px 'Inter', 'Segoe UI', Arial, sans-serif;
        text-anchor: middle;
      }

      .subtitle {
        fill: #8b949e;
        font: 400 14px 'Inter', 'Segoe UI', Arial, sans-serif;
        text-anchor: middle;
      }

      .section {
        fill: #8b949e;
        font: 700 14px 'Inter', 'Segoe UI', Arial, sans-serif;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }

      .text-complete {
        fill: #d8ffe9;
        font: 600 16px 'Inter', 'Segoe UI', Arial, sans-serif;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .text-special {
        fill: #dbeafe;
        font: 600 16px 'Inter', 'Segoe UI', Arial, sans-serif;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .text-pending {
        fill: #8b949e;
        font: 600 16px 'Inter', 'Segoe UI', Arial, sans-serif;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .legend-title {
        fill: #f0f6fc;
        font: 700 13px 'Inter', 'Segoe UI', Arial, sans-serif;
      }

      .legend-text {
        fill: #8b949e;
        font: 400 12px 'Inter', 'Segoe UI', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2"
        y="2"
        width="796"
        height="1796"
        rx="18"
        class="panel"/>

  <!-- Header -->
  <text x="400" y="55" class="title">42 Cursus</text>
  <text x="400" y="82" class="subtitle">
    Software engineering roadmap
  </text>

  <!-- ========================= -->
  <!-- COMMON CORE -->
  <!-- ========================= -->

  <text x="400" y="125" class="section">
    COMMON CORE
  </text>

  <!-- Libft -->
  <rect x="290" y="150" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="182" class="text-complete">Libft</text>

  <!-- Connector -->
  <path class="line-complete" d="M400 215 V250"/>

  <!-- Level 2 -->
  <rect x="100" y="250" width="180" height="65"
        rx="12" class="node-complete"/>
  <text x="190" y="282" class="text-complete">ft_printf</text>

  <rect x="310" y="250" width="180" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="282" class="text-complete">get_next_line</text>

  <rect x="520" y="250" width="180" height="65"
        rx="12" class="node-complete"/>
  <text x="610" y="282" class="text-complete">Born2beroot</text>

  <!-- Branch -->
  <path class="line-complete" d="M400 250 H190"/>
  <path class="line-complete" d="M400 250 V250"/>
  <path class="line-complete" d="M400 250 H610"/>

  <!-- Downward connectors -->
  <path class="line-complete" d="M190 315 V350 H400"/>
  <path class="line-complete" d="M400 315 V350"/>
  <path class="line-complete" d="M610 315 V350 H400"/>

  <!-- Level 3 -->
  <rect x="290" y="350" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="382" class="text-complete">push_swap</text>

  <path class="line-complete" d="M400 415 V450"/>

  <!-- minitalk -->
  <rect x="290" y="450" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="482" class="text-complete">minitalk</text>

  <path class="line-complete" d="M400 515 V550"/>

  <!-- so_long -->
  <rect x="290" y="550" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="582" class="text-complete">so_long</text>

  <path class="line-complete" d="M400 615 V650"/>

  <!-- pipex -->
  <rect x="290" y="650" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="682" class="text-complete">pipex</text>

  <path class="line-complete" d="M400 715 V750"/>

  <!-- Philosophers -->
  <rect x="290" y="750" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="782" class="text-complete">Philosophers</text>

  <path class="line-complete" d="M400 815 V850"/>

  <!-- minishell -->
  <rect x="290" y="850" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="882" class="text-complete">minishell</text>

  <path class="line-complete" d="M400 915 V950"/>

  <!-- NetPractice -->
  <rect x="290" y="950" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="982" class="text-complete">NetPractice</text>

  <path class="line-complete" d="M400 1015 V1050"/>

  <!-- cub3d -->
  <rect x="290" y="1050" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="1082" class="text-complete">cub3d</text>

  <path class="line-complete" d="M400 1115 V1150"/>

  <!-- C++ Modules -->
  <rect x="290" y="1150" width="220" height="65"
        rx="12" class="node-complete"/>
  <text x="400" y="1182" class="text-complete">C++ Modules</text>

  <!-- ========================= -->
  <!-- SPECIALIZATION -->
  <!-- ========================= -->

  <path class="line-complete" d="M400 1215 V1265"/>

  <text x="400" y="1300" class="section">
    SPECIALIZATION
  </text>

  <!-- Inception -->
  <rect x="290" y="1330" width="220" height="65"
        rx="12" class="node-special"/>
  <text x="400" y="1362" class="text-special">Inception</text>

  <path class="line-complete" d="M400 1395 V1435"/>

  <!-- ft_transcendence -->
  <rect x="250" y="1435" width="300" height="65"
        rx="12" class="node-special"/>
  <text x="400" y="1467" class="text-special">ft_transcendence</text>

  <!-- ========================= -->
  <!-- LEGEND -->
  <!-- ========================= -->

  <rect x="100"
        y="1570"
        width="600"
        height="145"
        rx="14"
        fill="#0d1117"
        stroke="#21262d"/>

  <!-- Completed -->
  <rect x="135" y="1600"
        width="18"
        height="18"
        rx="4"
        class="node-complete"/>

  <text x="170" y="1614" class="legend-title">
    Completed
  </text>

  <text x="170" y="1634" class="legend-text">
    Validated project
  </text>

  <!-- Specialization -->
  <rect x="350" y="1600"
        width="18"
        height="18"
        rx="4"
        class="node-special"/>

  <text x="385" y="1614" class="legend-title">
    Specialization
  </text>

  <text x="385" y="1634" class="legend-text">
    Advanced project
  </text>

  <!-- Upcoming -->
  <rect x="135" y="1670"
        width="18"
        height="18"
        rx="4"
        class="node-pending"/>

  <text x="170" y="1684" class="legend-title">
    Upcoming
  </text>

  <text x="170" y="1704" class="legend-text">
    Not completed
  </text>

  <!-- Footer -->
  <text x="400"
        y="1755"
        class="subtitle">
    42 School • Software Engineering
  </text>

</svg>

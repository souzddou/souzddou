<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 1150"
     role="img"
     aria-labelledby="title desc">

  <title id="title">42 Cursus Roadmap</title>
  <desc id="desc">Horizontal hub-and-spoke 42 School cursus roadmap with glowing animated connector lines.</desc>

  <defs>
    <linearGradient id="flowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fce7a"/>
      <stop offset="50%" stop-color="#8bffc7"/>
      <stop offset="100%" stop-color="#2fce7a"/>
    </linearGradient>

    <linearGradient id="finalGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a7d1ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="nodeGlowBlue" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="hubGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8bffc7"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a7d1ff"/>
    </marker>

    <style>
      .panel { fill:#0d1117; stroke:#30363d; stroke-width:2; }

      .edge {
        fill:none; stroke:url(#flowGradient); stroke-width:2.5;
        stroke-linecap:round; stroke-dasharray:6 9;
        filter:url(#lineGlow); animation:flow 1.6s linear infinite;
        marker-end:url(#arrow);
      }
      .edge-final {
        fill:none; stroke:url(#finalGradient); stroke-width:2.5;
        stroke-linecap:round; stroke-dasharray:6 9;
        filter:url(#lineGlow); animation:flow 1.6s linear infinite;
        marker-end:url(#arrowBlue);
      }
      @keyframes flow { to { stroke-dashoffset:-30; } }

      .hub {
        fill:#2fce7a; filter:url(#hubGlow);
        animation:hubPulse 2.2s ease-in-out infinite;
      }
      @keyframes hubPulse { 0%,100% { r:5; opacity:1; } 50% { r:6.5; opacity:0.7; } }

      .node-complete {
        fill:#173524; stroke:#2fce7a; stroke-width:2;
        filter:url(#nodeGlow); animation:pulseGreen 3s ease-in-out infinite;
      }
      @keyframes pulseGreen { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:0.55; } }

      .node-final {
        fill:#17243a; stroke:#58a6ff; stroke-width:2.5;
        filter:url(#nodeGlowBlue); animation:pulseBlue 2.4s ease-in-out infinite;
      }
      @keyframes pulseBlue { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:0.5; } }

      .title { fill:#f0f6fc; font:800 30px 'Inter','Segoe UI',Arial,sans-serif; text-anchor:middle; }
      .subtitle { fill:#8b949e; font:400 14px 'Inter','Segoe UI',Arial,sans-serif; text-anchor:middle; }
      .section { fill:#8b949e; font:700 14px 'Inter','Segoe UI',Arial,sans-serif; letter-spacing:1.5px; text-anchor:middle; }

      .text-complete { fill:#d8ffe9; font:600 15px 'Inter','Segoe UI',Arial,sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .text-final { fill:#dbeafe; font:700 15px 'Inter','Segoe UI',Arial,sans-serif; text-anchor:middle; dominant-baseline:middle; }

      .legend-title { fill:#f0f6fc; font:700 13px 'Inter','Segoe UI',Arial,sans-serif; }
      .legend-text { fill:#8b949e; font:400 12px 'Inter','Segoe UI',Arial,sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="1146" rx="18" class="panel"/>

  <text x="450" y="48" class="title">42 Cursus</text>
  <text x="450" y="75" class="subtitle">Software engineering roadmap</text>
  <text x="450" y="113" class="section">COMMON CORE</text>

  <!-- ===================== EDGES ===================== -->
  <!-- hub0 -> Libft -->
  <path class="edge" d="M450 150 C450 165, 450 165, 450 188"/>
  <!-- Libft -> hub1 -->
  <path class="edge" d="M450 250 C450 270, 450 270, 450 298"/>

  <!-- hub1 -> row1 (ft_printf, get_next_line, Born2beroot) -->
  <path class="edge" d="M450 300 C450 315, 220 320, 220 338"/>
  <path class="edge" d="M450 300 C450 315, 450 320, 450 338"/>
  <path class="edge" d="M450 300 C450 315, 680 320, 680 338"/>

  <!-- row1 -> hub2 -->
  <path class="edge" d="M220 400 C220 420, 450 430, 450 448"/>
  <path class="edge" d="M450 400 C450 420, 450 430, 450 448"/>
  <path class="edge" d="M680 400 C680 420, 450 430, 450 448"/>

  <!-- hub2 -> row2 (push_swap, minitalk, so_long, pipex) -->
  <path class="edge" d="M450 450 C450 465, 120 475, 120 488"/>
  <path class="edge" d="M450 450 C450 465, 340 475, 340 488"/>
  <path class="edge" d="M450 450 C450 465, 560 475, 560 488"/>
  <path class="edge" d="M450 450 C450 465, 780 475, 780 488"/>

  <!-- row2 -> hub3 -->
  <path class="edge" d="M120 550 C120 570, 450 580, 450 598"/>
  <path class="edge" d="M340 550 C340 570, 450 580, 450 598"/>
  <path class="edge" d="M560 550 C560 570, 450 580, 450 598"/>
  <path class="edge" d="M780 550 C780 570, 450 580, 450 598"/>

  <!-- hub3 -> row3 (Philosophers, minishell, NetPractice, cub3d) -->
  <path class="edge" d="M450 600 C450 615, 120 625, 120 638"/>
  <path class="edge" d="M450 600 C450 615, 340 625, 340 638"/>
  <path class="edge" d="M450 600 C450 615, 560 625, 560 638"/>
  <path class="edge" d="M450 600 C450 615, 780 625, 780 638"/>

  <!-- row3 -> hub4 -->
  <path class="edge" d="M120 700 C120 720, 450 730, 450 748"/>
  <path class="edge" d="M340 700 C340 720, 450 730, 450 748"/>
  <path class="edge" d="M560 700 C560 720, 450 730, 450 748"/>
  <path class="edge" d="M780 700 C780 720, 450 730, 450 748"/>

  <!-- hub4 -> row4 (C++ Modules, Inception, ft_transcendence) -->
  <path class="edge" d="M450 750 C450 765, 220 770, 220 788"/>
  <path class="edge" d="M450 750 C450 765, 450 770, 450 788"/>
  <path class="edge" d="M450 750 C450 765, 680 770, 680 788"/>

  <!-- row4 -> end -->
  <path class="edge" d="M220 850 C220 870, 450 880, 450 898"/>
  <path class="edge" d="M450 850 C450 870, 450 880, 450 898"/>
  <path class="edge" d="M680 850 C680 870, 450 880, 450 898"/>

  <!-- ===================== HUBS ===================== -->
  <circle cx="450" cy="150" r="5" class="hub"/>
  <circle cx="450" cy="300" r="5" class="hub"/>
  <circle cx="450" cy="450" r="5" class="hub"/>
  <circle cx="450" cy="600" r="5" class="hub"/>
  <circle cx="450" cy="750" r="5" class="hub"/>
  <circle cx="450" cy="900" r="5" class="hub"/>

  <!-- ===================== NODES ===================== -->
  <!-- Row 0 -->
  <rect x="340" y="190" width="220" height="60" rx="12" class="node-complete"/>
  <text x="450" y="221" class="text-complete">Libft</text>

  <!-- Row 1 -->
  <rect x="130" y="340" width="180" height="60" rx="12" class="node-complete"/>
  <text x="220" y="371" class="text-complete">ft_printf</text>

  <rect x="360" y="340" width="180" height="60" rx="12" class="node-complete"/>
  <text x="450" y="371" class="text-complete">get_next_line</text>

  <rect x="590" y="340" width="180" height="60" rx="12" class="node-complete"/>
  <text x="680" y="371" class="text-complete">Born2beroot</text>

  <!-- Row 2 -->
  <rect x="30" y="490" width="180" height="60" rx="12" class="node-complete"/>
  <text x="120" y="521" class="text-complete">push_swap</text>

  <rect x="250" y="490" width="180" height="60" rx="12" class="node-complete"/>
  <text x="340" y="521" class="text-complete">minitalk</text>

  <rect x="470" y="490" width="180" height="60" rx="12" class="node-complete"/>
  <text x="560" y="521" class="text-complete">so_long</text>

  <rect x="690" y="490" width="180" height="60" rx="12" class="node-complete"/>
  <text x="780" y="521" class="text-complete">pipex</text>

  <!-- Row 3 -->
  <rect x="30" y="640" width="180" height="60" rx="12" class="node-complete"/>
  <text x="120" y="671" class="text-complete">Philosophers</text>

  <rect x="250" y="640" width="180" height="60" rx="12" class="node-complete"/>
  <text x="340" y="671" class="text-complete">minishell</text>

  <rect x="470" y="640" width="180" height="60" rx="12" class="node-complete"/>
  <text x="560" y="671" class="text-complete">NetPractice</text>

  <rect x="690" y="640" width="180" height="60" rx="12" class="node-complete"/>
  <text x="780" y="671" class="text-complete">cub3d</text>

  <!-- Row 4 -->
  <rect x="130" y="790" width="180" height="60" rx="12" class="node-complete"/>
  <text x="220" y="821" class="text-complete">C++ Modules</text>

  <rect x="360" y="790" width="180" height="60" rx="12" class="node-complete"/>
  <text x="450" y="821" class="text-complete">Inception</text>

  <rect x="590" y="790" width="180" height="60" rx="12" class="node-complete"/>
  <text x="680" y="821" class="text-complete">ft_transcendence</text>

  <text x="450" y="940" class="section">ALL PROJECTS VALIDATED ✓</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="300" y="975" width="300" height="90" rx="14" fill="#0d1117" stroke="#21262d"/>

  <rect x="335" y="1005" width="18" height="18" rx="4" class="node-complete"/>
  <text x="370" y="1019" class="legend-title">Completed</text>
  <text x="370" y="1039" class="legend-text">Validated project</text>

  <text x="450" y="1120" class="subtitle">42 School • Software Engineering</text>

</svg>

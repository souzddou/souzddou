      .edge { fill: none; stroke: #3f4a63; stroke-width: 3; stroke-linecap: round; }
      .node { rx: 14; ry: 14; stroke-width: 2.5; }
      .done { fill: #0f2a1f; stroke: #22c55e; }
      .doing { fill: #2f2410; stroke: #f59e0b; }
      .todo { fill: #1b2437; stroke: #64748b; }
      .label { fill: #e6edf3; font: 600 17px 'Segoe UI', Inter, Arial, sans-serif; }
      .legend { fill: #c8d1dc; font: 500 15px 'Segoe UI', Inter, Arial, sans-serif; }
    </style>
  </defs>


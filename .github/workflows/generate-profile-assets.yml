name: Generate profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate info card
        run: python scripts/make_info_card.py

      - name: Generate contribution heatmap
        run: python scripts/fetch_contributions.py --username souzddou

      - name: Generate ASCII portrait (if source exists)
        run: |
          if [ -f source-prepped.png ]; then
            python scripts/make_ascii_svg.py --input source-prepped.png
          else
            echo "source-prepped.png not found; skipping avi-ascii.svg generation"
          fi

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile terminal assets"
          file_pattern: "avi-ascii.svg info-card.svg contrib-heatmap.svg data/contributions.json"
